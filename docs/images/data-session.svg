<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 708" width="1000" height="708" role="img" aria-labelledby="title description" font-family="Segoe UI, Arial, sans-serif"><title id="title">Where your work is kept</title><desc id="description">Excel files are on your device. Working values, Last Saved and Simulation stay in the browser session. Save creates a session checkpoint, Reset restores it, and Export creates an Excel file. Cost Breakdown reads Working values. Simulation can send supported parameters back to Working.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#49647b" /></marker></defs><rect width="1000" height="708" fill="#ffffff" rx="12" /><rect x="2" y="222" width="996" height="418" rx="12" fill="#f2f7fa" stroke="#c7d6df" stroke-width="2" /><path d="M 507 130 L 507 260" fill="none" stroke="#49647b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 493 260 L 493 130" fill="none" stroke="#49647b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 380 317 L 168 317 Q 160 317 160 325 L 160 520" fill="none" stroke="#49647b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 264 520 L 264 352 Q 264 344 272 344 L 380 344" fill="none" stroke="#49647b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 500 360 L 500 520" fill="none" stroke="#49647b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 620 303 L 832 303 Q 840 303 840 311 L 840 520" fill="none" stroke="#49647b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 736 520 L 736 352 Q 736 344 728 344 L 620 344" fill="none" stroke="#49