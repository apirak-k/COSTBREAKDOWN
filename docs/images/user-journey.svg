<text x="805" y="515" font-size="19">Result · Cost Structure · Break-even</text>
<text x="805" y="550" font-size="19">Send parameter changes back</text>
<text x="805" y="575" font-size="19">to matching Master Data roles if needed</text>
<rect x="160" y="658" width="780" height="116" rx="8" fill="#e7f5f2"/>
<text x="550" y="696" font-size="28" font-weight="700">Keep the work you need</text>
<text x="550" y="728" font-size="21">Master Data · Export each dataset to Excel</text>
<text x="550" y="756" font-size="18">After Send, review the matching dataset before saving or exporting.</text>
<rect x="230" y="802" width="640" height="82" rx="8" fill="#14243a"/>
