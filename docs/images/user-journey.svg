<text x="550" y="331" font-size="21">Prepare Dataset · Warnings / Blockers</text>
<rect x="60" y="408" width="470" height="184" rx="8" fill="#e7f5f2"/>
<text x="295" y="447" font-size="28" font-weight="700">Compare costs</text>
<text x="295" y="479" font-size="24" fill="#006d66">Cost Breakdown</text>
<text x="295" y="515" font-size="20">Before / After · Standard Cost Gap</text>
<text x="295" y="550" font-size="19">Selected Comparison:</text>
<text x="295" y="575" font-size="19">focus on chosen findings</text>
<rect x="570" y="408" width="470" height="184" rx="8" fill="#edf2f8"/>
