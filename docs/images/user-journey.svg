<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 564" width="1100" height="564" role="img" aria-labelledby="title description" font-family="Segoe UI, Arial, sans-serif"><title id="title">From cost data to a decision</title><desc id="description">Import inputs from Excel into Master Data. Use Cost Breakdown to explain cost changes or Simulation to try changes. Send supported parameters back if needed. Export Master Data inputs to Excel.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#49647b" /></marker></defs><rect width="1100" height="564" fill="#ffffff" rx="12" /><path d="M 260 275 L 420 275" fill="none" stroke="#49647b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 420 261 L 260 261" fill="none" stroke="#49647b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 660 236 L 828 236 Q 836 236 836 228 L 836 136" fill="none" stroke="#49647b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 644 316 L 644 408 Q 644 416 652 416 L 820 416" fill="none" stroke="#49647b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 820 455 L 548 455 Q 540 455 540 447 L 540 316" fill="none" stroke="#49647b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="40.0" y="220.0" width="220.0" height="96.0" rx="12" fill="#e8f5f2" stroke="#187d75" stroke-width="2" /><text x="150.0" y="263.0" font-size="24" fill="#14243a" font-weight="600" text-anchor="middle">Excel workbook</text><text x="150.0" y="291.0" font-size="16" fill="#345469" font-weight="400" text-anchor="middle">Keep or share your inputs</text><rect x="420.0" y="220.0" width="240.0" height="96.0" rx="12" fill="#14243a" stroke="#14243a" stroke-width="2" /><text x="540.0" y="263.0" font-size="24" fill="#ffffff" font-weight="600" text-anchor="middle">Master Data</text><text x="540.0" y="291.0" font-size="16" fill="#e5f2f0" font-weight="400" text-anchor="middle">Prepare and check datasets</text><rect x="820.0" y="40.0" width="240.0" height="96.0" rx="12" fill="#e8f5f2" stroke="#187d75" stroke-width="2" /><text x="940.0" y="83.0" font-size="24" fill="#14243a" font-weight="600" text-anchor="middle">Cost Breakdown</text><text x="940.0" y="111.0" font-size="16" fill="#345469" font-weight="400" text-anchor="middle">Explain a cost change</text><rect x="820.0" y="400.0" width="240.0" height="96.0" rx="12" fill="#e8f5f2" stroke="#187d75" stroke-width="2" /><text x="940.0" y="443.0" font-size="24" fill="#14243a" font-weight="600" text-anchor="middle">Simulation</text><text x="940.0" y="471.0" font-size="16" fill="#345469" font-weight="400" text-anchor="middle">Try proposed changes</text><text x="340.0" y="300.0" font-size="16" fill="#345469" font-weight="600" text-anchor="middle">Import</text><text x="340.0" y="250.0" font-size="16" fill="#345469" font-weight="600" text-anchor="middle">Export</text><text x="852.0" y="181.0" font-size="16" fill="#345469" font-weight="600" text-anchor="start">Compare</text><text x="732.0" y="395.0" font-size="16" fill="#345469" font-weight="600" text-anchor="middle">Try changes</text><text x="680.0" y="479.0" font-size="16" fill="#345469" font-weight="600" text-anchor="middle">Send if needed</text></svg>