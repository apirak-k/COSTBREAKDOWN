<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="930" viewBox="0 0 1100 930" role="img" aria-labelledby="title desc">
<title id="title">Your path through COSTBREAKDOWN</title>
<desc id="desc">Open the portable app. Prepare Reference, Current, and Custom in Master Data and review warnings and blockers. Choose Cost Breakdown to compare costs, or Simulation to try changes. Selected Comparison stays within Cost Breakdown. Simulation can send parameter changes back to the matching Master Data dataset. Export important datasets, then stop the app.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52677b"/></marker></defs>
<rect width="1100" height="930" fill="#ffffff"/>
<g fill="none" stroke="#52677b" stroke-width="3" marker-end="url(#arrow)">
<path d="M550 106 V130"/><path d="M550 238 V262"/>
<path d="M550 352 V380 H295 V404"/><path d="M550 352 V380 H805 V404"/>
<path d="M295 592 V626 H550 V654"/><path d="M805 592 V626 H550" marker-end="none"/>
<path d="M550 774 V798"/>
</g>
